        const median = arr => {
            const mid = Math.floor(arr.length / 2),
                nums = [...arr].sort((a, b) => a - b);
            return arr.length % 2 !== 0 ? nums[mid] : (nums[mid - 1] + nums[mid]) / 2;
        };
        function mode(numbers) {
            // as result can be bimodal or multi-modal, the returned result is provided as an array
            // mode of [3, 5, 4, 4, 1, 1, 2, 3] = [1, 3, 4]
            var modes = [],
                count = [],
                i, number, maxIndex = 0;

            for (i = 0; i < numbers.length; i += 1) {
                number = numbers[i];
                count[number] = (count[number] || 0) + 1;
                if (count[number] > maxIndex) {
                    maxIndex = count[number];
                }
            }

            for (i in count)
                if (count.hasOwnProperty(i)) {
                    if (count[i] === maxIndex) {
                        modes.push(Number(i));
                    }
                }

            return modes;
        }

                followmeter.text(roundup(10 - greenLinebar.y() / 25))
                if ((recorder23.length < 1)) {
                    if (showselect2) { text3EQ.text("Mode Calculation : Not Available") } else { text3EQ.text('') }
                } else {
                    for (l = 0; l < 10; l++) {
                        if (recorder[l] > 0) {
                            star0[l].x(325 + recorder[l] * 25)
                            star0[l].y(350 - bucket[recorder[l]] * 25 - 12.5 - 0 * 25 + 50)
                            star0[l].show()
                            star0text[l].x(star0[l].x() - 5)
                            star0text[l].y(star0[l].y() - 5)
                            star0text[l].text(recorder[l])
                            star0text[l].show()
                            bucket[recorder[l]] = bucket[recorder[l]] + 1;
                        } else {
                            star0[l].hide()
                            star0text[l].hide()
                        }
                    }
                    if (showselect2) { text3EQ.text("Mode Calculation : " + mode(recorder23)) } else { text3EQ.text('') }
                }
            }
            if (recorder23.length < 1) {
                textAnswer.text('Array : \n\n')
                if (showselect) {
                    textAnswer2.text('Mean :  \nMedian:  \nMode : \n')
                }
                else {
                    textAnswer2.text('')
                }
            } else {
                textAnswer.text('Array : ' + recorder23)
                if (showselect) {
                    textAnswer2.text('Mean: ' + mean(recorder23) + '\nMedian: ' + median(recorder23) + ' \nMode: ' + mode(recorder23))
                }
                else {
                    textAnswer2.text('')
                }
            }
            layer.draw();
        }

        stage.on('dragstart', function (e) {
            e.target.moveTo(tempLayer);
            text.text('Moving ' + e.target.name() + ' ' + e.target.x() + ' ' + e.target.y());
            layer.draw();
        });

        var previousShape;
        stage.on('dragmove', function (evt) {
            checkeverybody(evt);
            var pos = stage.getPointerPosition();
            var shape = layer.getIntersection(pos);
            if (previousShape && shape) {
                if (previousShape !== shape) {
                    // leave from old targer
                    previousShape.fire(
                        'dragleave', {
                        type: 'dragleave',
                        target: previousShape,
                        evt: evt.evt,
                    },
                        true
                    );

                    // enter new targer
                    shape.fire(
                        'dragenter', {
                        type: 'dragenter',
                        target: shape,
                        evt: evt.evt,
                    },
                        true
                    );
                    previousShape = shape;
                } else {
                    previousShape.fire(
                        'dragover', {
                        type: 'dragover',
                        target: previousShape,
                        evt: evt.evt,
                    },
                        true
                    );
                }
            } else if (!previousShape && shape) {
                previousShape = shape;
                shape.fire(
                    'dragenter', {
                    type: 'dragenter',
                    target: shape,
                    evt: evt.evt,
                },
                    true
                );
            } else if (previousShape && !shape) {
                previousShape.fire(
                    'dragleave', {
                    type: 'dragleave',
                    target: previousShape,
                    evt: evt.evt,
                },
                    true
                );
                previousShape = undefined;
            }
        });
        stage.on('dragend', function (e) {
            var pos = stage.getPointerPosition();
            var shape = layer.getIntersection(pos);
            if (shape) {
                previousShape.fire(
                    'drop', {
                    type: 'drop',
                    target: previousShape,
                    evt: e.evt,
                },
                    true
                );
            }
            previousShape = undefined;
            e.target.moveTo(layer);
            layer.draw();
            tempLayer.draw();
        });

        stage.on('dragenter', function (e) {
            //e.target.fill('orange');
            text.text('dragenter ' + e.target.name() + ' ' + e.target.x() + ' ' + e.target.y() + ' ');
            layer.draw();
        });

        stage.on('dragleave', function (e) {
            //e.target.fill('pink');
            text.text('dragleave ' + e.target.name() + ' ' + e.target.x() + ' ' + e.target.y() + ' ');
            layer.draw();
        });

        stage.on('dragover', function (e) {
            text.text('dragover ' + e.target.name() + ' ' + e.target.x() + ' ' + e.target.y() + ' ');
            layer.draw();
        });

        stage.on('drop', function (e) {
            //e.target.fill('red');
            text.text('drop ' + e.target.name() + ' ' + e.target.x() + ' ' + e.target.y() + ' ');
            layer.draw();
        });
    </script>
</body>

</html>
